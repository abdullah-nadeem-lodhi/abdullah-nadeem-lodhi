name: Generate Profile Metrics

# Regenerates an extended metrics panel (lowlighter/metrics) and commits it
# straight to the repo so it can be embedded in README.md.
on:
  schedule:
    - cron: "0 3 * * *"      # once a day, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # --- Feature toggles -------------------------------------------------
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_habits: yes
          plugin_habits_charts_type: bars
          plugin_lines: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          # -----------------------------------------------------------------------
          config_timezone: Asia/Karachi

# Setup notes:
#   1. Create a Personal Access Token (classic) with "read:user" and
#      "repo" scopes, then add it as a repository secret named
#      METRICS_TOKEN. The default GITHUB_TOKEN is not sufficient because
#      this plugin set reads cross-repo data.
#   2. On first run this workflow commits metrics.svg to the repo root.
#      README.md already references ./metrics.svg — no further edits needed.
#   3. This section is OPTIONAL — delete this file and the "Extended
#      Metrics" section in README.md if you'd rather keep the profile
#      lighter on integrations.
