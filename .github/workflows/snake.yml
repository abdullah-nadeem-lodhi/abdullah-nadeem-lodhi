name: Generate Snake Animation

# Regenerates the contribution snake (Platane/snk) on a schedule, on push to
# main, and manually via the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"      # once a day, midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%2358A6FF&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2358A6FF

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Setup notes:
#   1. This workflow must live in your profile repo: <username>/<username>.
#   2. After the first successful run, an "output" branch will be created
#      containing the generated SVG/GIF files.
#   3. README.md already references these raw output-branch URLs — no
#      further edits needed once the workflow has run once.
#   4. TODO: if your default branch is not "main", update the push trigger.
